<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Cantina del Delfín — Marisquería · San Clemente del Tuyú</title>
<meta name="description" content="Carta de La Cantina del Delfín, marisquería en San Clemente del Tuyú. Entradas, mariscos, pescados, pastas caseras, parrilla, postres y vinos.">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #0b2f4f;
    --navy-deep: #071f38;
    --ink: #1c2b36;
    --paper: #faf6ee;
    --paper-alt: #f3ecdd;
    --line: #d8cdb4;
    --gold: #9c6b2e;
    --gold-soft: #b8873f;
    --foam: #bfe0ea;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    font-size:16px;
    line-height:1.5;
  }

  h1,h2,h3{
    font-family:'Fraunces', Georgia, serif;
    margin:0;
  }

  a{ color:inherit; }

  .hero{
    position:relative;
    background: radial-gradient(120% 160% at 50% -20%, #123a5e 0%, var(--navy) 45%, var(--navy-deep) 100%);
    color:#fff;
    text-align:center;
    padding: 3.5rem 1.5rem 4.5rem;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(191,224,234,.10) 0, transparent 40%),
      radial-gradient(circle at 85% 75%, rgba(191,224,234,.08) 0, transparent 45%);
    pointer-events:none;
  }
  .hero-logo{
    width: clamp(140px, 22vw, 200px);
    height: auto;
    object-fit:contain;
    filter: drop-shadow(0 14px 26px rgba(0,0,0,.35));
    margin-bottom:1.25rem;
    position:relative;
  }
  .hero-eyebrow{
    letter-spacing:.28em;
    text-transform:uppercase;
    font-size:.72rem;
    color:var(--foam);
    font-weight:600;
    margin-bottom:.6rem;
  }
  .hero h1{
    font-size: clamp(2.2rem, 6vw, 3.6rem);
    font-weight:600;
    line-height:1.05;
    margin-bottom:.6rem;
  }
  .hero-sub{
    font-size:1.05rem;
    color:#d9e6ee;
    font-weight:400;
  }
  .hero-contact{
    margin-top:.5rem;
    font-size:1.05rem;
    color:#d9e6ee;
    font-weight:400;
    line-height:1.6;
  }
  .hero-contact a{
    color:#d9e6ee;
    text-decoration:none;
    border-bottom:1px solid rgba(217,230,238,.4);
    transition:border-color .15s ease;
  }
  .hero-contact a:hover{
    border-color: rgba(217,230,238,.9);
  }
  .hero-wave{
    position:absolute;
    left:0; right:0; bottom:-1px;
    line-height:0;
  }
  .hero-wave svg{ width:100%; height:auto; display:block; }

  .nav-wrap{
    position:sticky;
    top:0;
    z-index:40;
    background:rgba(250,246,238,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  nav.menu-nav{
    display:flex;
    gap:.35rem;
    overflow-x:auto;
    padding:.7rem 1rem;
    max-width:920px;
    margin:0 auto;
    scrollbar-width:none;
  }
  nav.menu-nav::-webkit-scrollbar{ display:none; }
  nav.menu-nav a{
    flex:0 0 auto;
    text-decoration:none;
    font-size:.82rem;
    font-weight:600;
    letter-spacing:.02em;
    color:var(--navy);
    background:transparent;
    padding:.4rem .85rem;
    border-radius:999px;
    border:1px solid transparent;
    white-space:nowrap;
    transition:background .15s ease, border-color .15s ease;
  }
  nav.menu-nav a:hover{ background:var(--paper-alt); border-color:var(--line); }
  nav.menu-nav a.active{ background:var(--navy); color:#fff; }

  main{ max-width:760px; margin:0 auto; padding: 2.4rem 1.4rem 1rem; }

  .menu-section{
    padding: 1.9rem 0 2.3rem;
    border-bottom:1px solid var(--line);
    scroll-margin-top: 4.2rem;
  }
  .menu-section:last-child{ border-bottom:none; }

  .section-title{
    font-size: 1.7rem;
    font-weight:600;
    color:var(--navy);
    display:inline-block;
    position:relative;
    padding-bottom:.35rem;
  }
  .section-title::after{
    content:"";
    display:block;
    width:2.6rem;
    height:3px;
    background:var(--gold-soft);
    margin-top:.5rem;
    border-radius:2px;
  }
  .section-subtitle{
    margin:.55rem 0 0;
    font-size:.88rem;
    font-style:italic;
    color:#6b6154;
  }
  .group-title{
    font-size:1.02rem;
    font-weight:600;
    color:var(--gold);
    text-transform:uppercase;
    letter-spacing:.05em;
    margin: 1.6rem 0 .5rem;
  }
  .group-title:first-of-type{ margin-top:1.2rem; }
  .item-list{ list-style:none; margin:1rem 0 0; padding:0; }
  .item{ margin:0 0 .68rem; }
  .item-row{ display:flex; align-items:baseline; gap:.4rem; }
  .item-name{ font-weight:500; color:var(--ink); font-size:.98rem; }
  .item-dots{ flex:1 1 auto; border-bottom:2px dotted var(--line); margin-bottom:.28rem; min-width:1rem; }
  .item-price{ font-weight:600; color:var(--gold); font-variant-numeric: tabular-nums; font-size:.98rem; white-space:nowrap; }
  .item-price-dual em{ font-style:normal; color:#a89a7d; padding:0 .1rem; font-weight:400; }
  .item-note{ margin:.15rem 0 0; font-size:.83rem; color:#726A5C; line-height:1.4; }

  #sugerencias-del-chef .item-name{ color:var(--navy); }
  #sugerencias-del-chef{
    background: var(--paper-alt);
    margin: 1.9rem -1.4rem 2.3rem;
    padding: 1.9rem 1.4rem 2.3rem;
    border-bottom:1px solid var(--line);
    border-top:1px solid var(--line);
  }

  .state-msg{ max-width:520px; margin: 3rem auto; text-align:center; padding: 0 1.4rem; color:#6b6154; }
  .state-msg .spinner{
    width:34px; height:34px; margin: 0 auto 1rem; border-radius:50%;
    border:3px solid var(--line); border-top-color: var(--gold-soft);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .state-msg.error{ color:#8a3b2f; }
  .state-msg button{
    margin-top:1rem; background:var(--navy); color:#fff; border:none;
    padding:.55rem 1.1rem; border-radius:8px; font-size:.85rem; font-weight:600; cursor:pointer;
  }
  .state-msg code{ background:rgba(0,0,0,.06); padding:.1rem .35rem; border-radius:4px; font-size:.85em; }
  .cache-note{ font-size:.76rem; color:#a89a7d; text-align:center; margin: -.5rem auto 1.5rem; }

  footer{ background:var(--navy-deep); color:#cfe0e8; text-align:center; padding: 2.6rem 1.5rem 2.2rem; margin-top:1rem; }
  footer img{ width:84px; height:auto; object-fit:contain; opacity:.9; margin-bottom:.8rem; }
  footer .foot-name{ font-family:'Fraunces', serif; font-size:1.15rem; color:#fff; margin-bottom:.2rem; }
  footer .foot-sub{ font-size:.78rem; letter-spacing:.06em; color:#8fa9b8; text-transform:uppercase; }
  footer .foot-contact{ margin-top:.9rem; font-size:.85rem; color:#cfe0e8; line-height:1.7; }
  footer .foot-contact a{
    color:#cfe0e8;
    text-decoration:none;
    border-bottom:1px solid rgba(207,224,232,.35);
    transition:border-color .15s ease;
  }
  footer .foot-contact a:hover{ border-color: rgba(207,224,232,.85); }

  @media (max-width:480px){
    .hero{ padding: 2.6rem 1.2rem 3.6rem; }
    main{ padding: 1.8rem 1rem 1rem; }
    #sugerencias-del-chef{ margin: 1.9rem -1rem 2.3rem; padding: 1.9rem 1rem 2.3rem; }
  }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    .state-msg .spinner{ animation:none; }
  }
</style>
</head>
<body>

<header class="hero">
  <img class="hero-logo" src="assets/logo.png" alt="Logo La Cantina del Delfín">
  <p class="hero-eyebrow">Marisquería</p>
  <h1>La Cantina del Delfín</h1>
  <p class="hero-sub">San Clemente del Tuyú</p>
  <p class="hero-contact">
    Av. XI 225<br>
    <a href="tel:+542252423211">02252 42-3211</a>
  </p>
  <div class="hero-wave">
    <svg viewBox="0 0 1200 60" preserveAspectRatio="none"><path d="M0,32 C150,60 350,0 600,28 C850,56 1050,8 1200,30 L1200,60 L0,60 Z" fill="#faf6ee"/></svg>
  </div>
</header>

<div class="nav-wrap">
<nav class="menu-nav" id="menu-nav"><!-- se genera con JS --></nav>
</div>

<main id="menu-main">
  <div class="state-msg" id="state-loading">
    <div class="spinner"></div>
    <p>Cargando la carta…</p>
  </div>
</main>

<footer>
  <img src="assets/chef-dolphin.png" alt="">
  <p class="foot-name">La Cantina del Delfín</p>
  <p class="foot-sub">Marisquería · San Clemente del Tuyú</p>
  <p class="foot-contact">
    Av. XI 225<br>
    <a href="tel:+542252423211">02252 42-3211</a>
  </p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
/* =========================================================================
   El menú se lee del archivo menu.csv en esta misma carpeta del repositorio.
   Se edita desde admin.html (panel de administración) o a mano en GitHub.
   ========================================================================= */
/* =========================================================================
   CONFIGURACIÓN — pegar acá la URL de la planilla de Google publicada como CSV
   (Archivo → Compartir → Publicar en la web → elegir la hoja → formato CSV)
   Ver README.md para el paso a paso.
   ========================================================================= */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRDgxfneWcUJiiZ8m6dgLZwQo3JU8uybYcnBxZNRrxrYGaDGQpkAspoQPUGBO6t1ZpcsxxDnzlxzGyD/pub?output=csv";
const CACHE_KEY = "menu-delfin-cache-v1";
/* ========================================================================= */
/* ========================================================================= */

function slugify(s){
  return s.toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function money(v){
  const n = parseFloat(v);
  if (v === undefined || v === null || v === "" || isNaN(n)) return "Consultar";
  return "$" + Math.round(n).toLocaleString('es-AR');
}

function esc(s){
  const d = document.createElement('div');
  d.textContent = s == null ? "" : s;
  return d.innerHTML;
}

function renderItem(row){
  const hasSecondPrice = row.precio2 !== undefined && String(row.precio2).trim() !== "";
  const priceHtml = hasSecondPrice
    ? `<span class="item-price item-price-dual">${money(row.precio)} <em>/</em> ${money(row.precio2)}</span>`
    : `<span class="item-price">${money(row.precio)}</span>`;
  let html = `<li class="item"><div class="item-row"><span class="item-name">${esc(row.item)}</span><span class="item-dots"></span>${priceHtml}</div>`;
  if (row.nota && row.nota.trim()) html += `<p class="item-note">${esc(row.nota)}</p>`;
  html += `</li>`;
  return html;
}

function buildMenu(rows){
  rows = rows.filter(r => r.seccion && r.item);

  rows.sort((a,b) => {
    const os = (parseFloat(a.orden_seccion)||0) - (parseFloat(b.orden_seccion)||0);
    if (os !== 0) return os;
    return (parseFloat(a.orden_item)||0) - (parseFloat(b.orden_item)||0);
  });

  const sections = [];
  const bySection = new Map();
  for (const r of rows){
    if (!bySection.has(r.seccion)){
      const obj = { titulo: r.seccion, id: slugify(r.seccion), subtitulo: "", groups: new Map(), plain: [] };
      bySection.set(r.seccion, obj);
      sections.push(obj);
    }
    const sec = bySection.get(r.seccion);
    if (r.subtitulo_seccion && r.subtitulo_seccion.trim() && !sec.subtitulo) sec.subtitulo = r.subtitulo_seccion.trim();
    if (r.grupo && r.grupo.trim()){
      if (!sec.groups.has(r.grupo)) sec.groups.set(r.grupo, []);
      sec.groups.get(r.grupo).push(r);
    } else {
      sec.plain.push(r);
    }
  }

  const nav = document.getElementById('menu-nav');
  nav.innerHTML = sections.map(s => `<a href="#${s.id}">${esc(s.titulo)}</a>`).join("");

  const main = document.getElementById('menu-main');
  const out = [];
  for (const s of sections){
    out.push(`<section class="menu-section" id="${s.id}">`);
    out.push(`<h2 class="section-title">${esc(s.titulo)}</h2>`);
    if (s.subtitulo) out.push(`<p class="section-subtitle">${esc(s.subtitulo)}</p>`);
    if (s.plain.length){
      out.push(`<ul class="item-list">`);
      out.push(s.plain.map(renderItem).join(""));
      out.push(`</ul>`);
    }
    if (s.groups.size){
      for (const [groupName, items] of s.groups){
        out.push(`<h3 class="group-title">${esc(groupName)}</h3>`);
        out.push(`<ul class="item-list">`);
        out.push(items.map(renderItem).join(""));
        out.push(`</ul>`);
      }
    }
    out.push(`</section>`);
  }
  main.innerHTML = out.join("\n");

  const links = document.querySelectorAll('#menu-nav a');
  const secEls = [...links].map(a => document.querySelector(a.getAttribute('href')));
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting){
        const id = '#' + entry.target.id;
        links.forEach(a => a.classList.toggle('active', a.getAttribute('href') === id));
        const active = document.querySelector('#menu-nav a.active');
        if (active) active.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
      }
    });
  }, { rootMargin: '-45% 0px -50% 0px', threshold: 0 });
  secEls.forEach(s => { if (s) obs.observe(s); });
}

function showError(){
  const main = document.getElementById('menu-main');
  main.innerHTML = `
    <div class="state-msg error">
      <p><strong>No se pudo cargar la carta actualizada.</strong><br>
      Verificá que la planilla de Google esté publicada como CSV y que la URL en <code>index.html</code> sea correcta.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>`;
}

function loadMenu(){
  if (!SHEET_CSV_URL || SHEET_CSV_URL.indexOf("REEMPLAZAR_CON_URL") !== -1){
    document.getElementById('menu-main').innerHTML = `
      <div class="state-msg error">
        <p><strong>Falta configurar la planilla.</strong><br>
        Pegá la URL de tu Google Sheet publicado como CSV en la constante <code>SHEET_CSV_URL</code> dentro de <code>index.html</code>.
        Mirá el <code>README.md</code> para el paso a paso.</p>
      </div>`;
    return;
  }

  Papa.parse(SHEET_CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: (results) => {
      if (!results.data || !results.data.length){
        showError();
        return;
      }
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ rows: results.data, ts: Date.now() })); } catch(e){}
      buildMenu(results.data);
    },
    error: () => {
      try {
        const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
        if (cached && cached.rows && cached.rows.length){
          buildMenu(cached.rows);
          const note = document.createElement('p');
          note.className = 'cache-note';
          note.textContent = 'Mostrando una copia guardada del menú (sin conexión a la planilla).';
          document.getElementById('menu-main').prepend(note);
          return;
        }
      } catch(e){}
      showError();
    }
  });
}

loadMenu();
</script>

</body>
</html>
